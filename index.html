
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Challenge Wheel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main">
    <div id="selectionTitle">Now Selecting: Elements</div>

    <div class="wheel-container">
        <div class="wheel-disc">
            <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
        </div>
        <img class="wheel-outer" src="ASSETS/Wheel_Outer.png">
        <img class="paimon" src="ASSETS/Paimon.png">
    </div>

    <div id="result">Ready?</div>
    <button id="spinButton">SPIN</button>
</div>

<div id="utilityButtons">
    <button class="utility-button" id="refreshButton">REFRESH</button>
    <button class="utility-button" id="hideButton">HIDE</button>
    <button class="utility-button" id="showButton" hidden>SHOW</button>
</div>

<script src="main.js"></script>
</body>
</html>
